name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      portable_only:
        description: "Build only the portable zip"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Portable build
        run: npm run build:windows:portable

      - name: Installer (nsis)
        if: ${{ !inputs.portable_only }}
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: localnote-portable
          path: dist-portable/*.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.portable_only }}
        with:
          name: localnote-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/LocalNote.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/LocalNote.exe
