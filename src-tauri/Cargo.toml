[package]
name = "localnote"
version = "1.2.0"
description = "A fast, reliable, local-only desktop notes application"
authors = ["LocalNote contributors"]
edition = "2021"

[lib]
name = "localnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "LocalNote"
path = "src/main.rs"

[features]
# `tauri/custom-protocol` swaps the dev-server URL for the assets embedded in the
# binary. Without it a `cargo build --release` binary opens http://localhost:1420
# and shows "localhost refused to connect" - so the portable build always enables it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"

[dev-dependencies]
tempfile = "3"
